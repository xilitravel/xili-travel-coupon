<!DOCTYPE html>

<html lang="zh-Hant">


<head>


<meta charset="UTF-8">


<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>


<title>

囍莉旅遊｜電子優惠券

</title>


<link
href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@600;700;800;900&display=swap"
rel="stylesheet"
>


<style>


*{

box-sizing:border-box;

}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:30px;

font-family:

"Noto Sans TC",
sans-serif;

background:

linear-gradient(
135deg,
#fdecef,
#f7e8f0,
#eee8f3
);

}


.coupon{

width:

min(
500px,
100%
);

background:

rgba(
255,
255,
255,
.9
);

border-radius:30px;

padding:

40px
30px;

text-align:center;

box-shadow:

0
25px
70px
rgba(
160,
90,
120,
.15
);

}


.logo{

font-family:

"Noto Serif TC",
serif;

font-size:42px;

font-weight:900;

color:#a95770;

letter-spacing:6px;

}


.subtitle{

margin-top:10px;

color:#8a7880;

}


.ticket{

margin-top:30px;

padding:25px;

border-radius:20px;

background:

linear-gradient(
135deg,
#fff4f7,
#f9eaf0
);

border:

2px dashed
#df94aa;

}


.discount{

font-size:42px;

font-weight:900;

color:#d45d80;

margin:20px 0;

}


.code{

font-size:22px;

font-weight:800;

letter-spacing:2px;

color:#655963;

padding:15px;

background:white;

border-radius:14px;

}


.status{

margin-top:20px;

padding:12px;

border-radius:14px;

font-weight:700;

}


.valid{

background:#e8f8ef;

color:#3b8c61;

}


.used{

background:#eee;

color:#777;

}


.invalid{

background:#fff0f2;

color:#c44f68;

}


.loading{

color:#b76f88;

margin-top:30px;

}


</style>


</head>


<body>


<div class="coupon">


<div class="logo">

囍莉旅遊

</div>


<div class="subtitle">

🎀 專屬電子優惠券 🎀

</div>


<div
id="content"
class="loading"
>

優惠券載入中...

</div>


</div>



<script>


const API_URL =

"請在這裡貼上你的GoogleAppsScript網址";


const params =

new URLSearchParams(
window.location.search
);


const code =

params.get("code");


async function loadCoupon(){


const content =

document
.getElementById("content");


if(!code){


content.innerHTML =

"<div class='status invalid'>❌ 找不到優惠券</div>";

return;


}


try{


const url =

API_URL

+

"?action=getCoupon"

+

"&code="

+

encodeURIComponent(code);


const response =

await fetch(url);


const result =

await response.json();


if(!result.success){


content.innerHTML =

"<div class='status invalid'>❌ "

+

result.message

+

"</div>";

return;


}


let statusClass =

result.status === "已使用"

?

"used"

:

"valid";


content.className = "";


content.innerHTML =


'<div class="ticket">'


+

"<div>🎫 專屬優惠券</div>"


+

'<div class="discount">'

+

"NT$ "

+

result.discount

+

"</div>"


+

'<div class="code">'

+

result.code

+

"</div>"


+

"<br>"


+

"<div>📅 有效期限："

+

result.validUntil

+

"</div>"


+

"<br>"


+

"<div>📝 "

+

result.note

+

"</div>"


+

"</div>"


+

'<div class="status '

+

statusClass

+

'>'


+

(

result.status === "已使用"

?

"⚠️ 此優惠券已使用"

:

"✅ 此優惠券可以使用"

)


+

"</div>";


}


catch(error){


content.innerHTML =

"<div class='status invalid'>"

+

"❌ 無法載入優惠券"

+

"</div>";


}


}


loadCoupon();


</script>


</body>


</html>
