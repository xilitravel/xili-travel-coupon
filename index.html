<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>囍莉旅遊｜工作人員後台</title>


<link
href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@500;600;700;800;900&family=Great+Vibes&display=swap"
rel="stylesheet"
>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
"Noto Sans TC",
sans-serif;

color:#655963;

background:

radial-gradient(
circle at 10% 10%,
rgba(255,190,215,.45),
transparent 30%
),

radial-gradient(
circle at 90% 20%,
rgba(255,170,205,.35),
transparent 30%
),

radial-gradient(
circle at 50% 90%,
rgba(230,220,245,.5),
transparent 40%
),

linear-gradient(
135deg,
#fdecef,
#f8e8f0,
#eee8f3,
#fae7ed
);

background-attachment:fixed;

padding-bottom:80px;

}


/* =====================
Header
===================== */


.header{

text-align:center;

padding:

45px
20px
25px;

}


.logo{

font-family:
"Noto Serif TC",
serif;

font-size:62px;

font-weight:900;

letter-spacing:9px;

color:#a95770;

text-shadow:

0 3px 0
rgba(255,255,255,.7),

0 10px 25px
rgba(160,85,110,.12);

}


.subtitle{

margin-top:10px;

font-size:16px;

font-weight:600;

letter-spacing:4px;

color:#786c74;

}


.travel{

margin-top:12px;

font-family:
"Great Vibes",
cursive;

font-size:32px;

color:#b76f88;

}


/* =====================
登入
===================== */


.login-box{

width:

min(
520px,
90%
);

margin:

35px
auto;

padding:

40px;

border-radius:35px;

background:

rgba(
255,
255,
255,
.82
);

backdrop-filter:

blur(15px);

box-shadow:

0
20px
55px
rgba(
145,
90,
115,
.15
);

text-align:center;

}


.login-icon{

font-size:45px;

margin-bottom:15px;

}


.login-title{

font-size:30px;

font-weight:800;

letter-spacing:4px;

color:#98566c;

margin-bottom:25px;

}


label{

display:block;

text-align:left;

font-weight:700;

margin-bottom:10px;

}


input,
textarea{

width:100%;

border:

1px solid
#ead5dc;

border-radius:16px;

padding:16px;

font-size:17px;

margin-bottom:20px;

font-family:
"Noto Sans TC";

background:white;

outline:none;

}


input:focus,
textarea:focus{

border:

1px solid
#d889a0;

box-shadow:

0
0
0
4px
rgba(
216,
137,
160,
.12
);

}


#pin{

text-align:center;

letter-spacing:6px;

font-size:22px;

}


/* =====================
按鈕
===================== */


button{

border:none;

border-radius:16px;

padding:17px;

width:100%;

font-family:
"Noto Sans TC";

font-size:18px;

font-weight:700;

cursor:pointer;

transition:.25s;

}


button:hover{

transform:

translateY(-2px);

}


.login-btn{

background:

linear-gradient(
135deg,
#e98ca8,
#c75d7c
);

color:white;

}


.pink-btn{

background:

linear-gradient(
135deg,
#f39ab5,
#d96a8b
);

color:white;

}


.blue-btn{

background:

linear-gradient(
135deg,
#9fd9ef,
#6fb9d8
);

color:white;

}


.green-btn{

background:

linear-gradient(
135deg,
#9fdfbb,
#65b98b
);

color:white;

}


/* =====================
Dashboard
===================== */


.dashboard{

display:none;

width:

min(
1300px,
92%
);

margin:

30px
auto;

}


.dashboard-grid{

display:grid;

grid-template-columns:

1fr
1fr;

gap:28px;

}


.card{

background:

rgba(
255,
255,
255,
.84
);

border-radius:30px;

padding:35px;

box-shadow:

0
20px
50px
rgba(
130,
80,
110,
.12
);

backdrop-filter:

blur(15px);

}


.card-title{

font-size:28px;

font-weight:800;

margin-bottom:25px;

}


.pink-title{

color:#c95f80;

}


.blue-title{

color:#5e9fbd;

}


.green-title{

color:#5fa885;

}


/* =====================
結果
===================== */


.result-box{

display:none;

margin-top:20px;

padding:18px;

border-radius:18px;

line-height:1.8;

}


.success{

background:#e8f8ef;

color:#3b8c61;

}


.error{

background:#fff0f2;

color:#c44f68;

}


.loading{

display:block;

background:#fff7e9;

color:#b67c35;

}


/* =====================
優惠券
===================== */


.coupon-list{

margin-top:25px;

}


.coupon-item{

background:white;

padding:20px;

border-radius:18px;

margin-bottom:15px;

border:

1px solid
#f0dce3;

line-height:1.9;

}


.link-box{

word-break:break-all;

margin-top:10px;

color:#4d91b5;

}


.link-box a{

color:#4d91b5;

}


/* =====================
QR
===================== */


#reader{

width:100%;

overflow:hidden;

border-radius:20px;

background:white;

}


.divider{

height:1px;

background:#ead5dc;

margin:

30px
0;

}


@media(max-width:850px){

.dashboard-grid{

grid-template-columns:
1fr;

}


.logo{

font-size:48px;

}


}


</style>

</head>


<body>


<!-- =====================
Header
===================== -->


<div class="header">

<div class="logo">

囍莉旅遊

</div>


<div class="subtitle">

電子優惠券｜工作人員後台

</div>


<div class="travel">

Travel Happy Together ♡

</div>


</div>



<!-- =====================
登入
===================== -->


<div
class="login-box"
id="loginBox"
>


<div class="login-icon">

🔐

</div>


<div class="login-title">

工作人員驗證

</div>


<label>

工作人員 PIN

</label>


<input
id="pin"
type="password"
placeholder="輸入 PIN"
onkeydown="
if(event.key==='Enter'){
login();
}
"
/>


<button
class="login-btn"
onclick="login()"
>

🌸 進入囍莉旅遊後台

</button>


<div
id="loginMessage"
class="result-box"
>

</div>


</div>



<!-- =====================
Dashboard
===================== -->


<div
class="dashboard"
id="dashboard"
>


<div class="dashboard-grid">



<!-- =====================
建立優惠券
===================== -->


<div class="card">


<div
class="
card-title
pink-title
"
>

🎟️ 建立優惠券

</div>


<label>

建立數量

</label>


<input
id="quantity"
type="number"
value="1"
min="1"
max="100"
/>


<label>

折扣金額

</label>


<input
id="discount"
type="number"
value="100"
/>


<label>

有效期限

</label>


<input
id="validUntil"
type="date"
/>


<label>

備註

</label>


<textarea
id="note"
placeholder="例如：國內旅遊折價券"
>

</textarea>


<button
class="pink-btn"
onclick="createCoupons()"
>

🎉 建立優惠券

</button>


<div
id="createResult"
class="coupon-list"
>

</div>


</div>



<!-- =====================
核銷
===================== -->


<div class="card">


<div
class="
card-title
blue-title
"
>

📷 優惠券核銷

</div>


<button
class="blue-btn"
onclick="startScanner()"
>

📷 開啟相機掃描

</button>


<br>
<br>


<div id="reader"></div>


<div class="divider"></div>



<div
class="
card-title
green-title
"
>

⌨️ 手動輸入券號

</div>


<input
id="manualCode"
placeholder="例如 XL-ABCD-1234"
onkeydown="
if(event.key==='Enter'){
redeemManual();
}
"
/>


<button
class="green-btn"
onclick="redeemManual()"
>

☑️ 確認核銷

</button>


<div
id="redeemResult"
class="result-box"
>

</div>


</div>


</div>


</div>



<script>


/* =====================
重要設定
===================== */


/*
把這裡換成
Google Apps Script 網頁應用程式網址
*/


const API_URL =

"請在這裡貼上你的GoogleAppsScript網址";



let html5QrCode = null;

let scannerRunning = false;



/* =====================
呼叫 API
===================== */


async function callAPI(action,data={}){


const url =

API_URL
+
"?action="
+
encodeURIComponent(action)
+
"&data="
+
encodeURIComponent(
JSON.stringify(data)
);


const response =

await fetch(url);


const result =

await response.json();


return result;


}



/* =====================
登入
===================== */


async function login(){


const pin =

document
.getElementById("pin")
.value
.trim();


const message =

document
.getElementById("loginMessage");


if(!pin){

message.className =
"result-box error";

message.style.display =
"block";

message.innerHTML =
"❌ 請輸入 PIN";

return;

}


message.className =
"result-box loading";

message.style.display =
"block";

message.innerHTML =
"⏳ 驗證中...";


try{


const result =

await callAPI(

"login",

{
pin:pin
}

);


if(result.success){


document
.getElementById("loginBox")
.style.display =
"none";


document
.getElementById("dashboard")
.style.display =
"block";


}


else{


message.className =
"result-box error";


message.innerHTML =
"❌ "
+
result.message;


}


}


catch(error){


message.className =
"result-box error";


message.innerHTML =
"❌ 無法連線：" 
+
error.message;


}


}



/* =====================
建立優惠券
===================== */


async function createCoupons(){


const quantity =

document
.getElementById("quantity")
.value;


const discount =

document
.getElementById("discount")
.value;


const validUntil =

document
.getElementById("validUntil")
.value;


const note =

document
.getElementById("note")
.value;


const resultBox =

document
.getElementById("createResult");


resultBox.innerHTML =

"⏳ 優惠券建立中...";


try{


const result =

await callAPI(

"create",

{

quantity:quantity,

discount:discount,

validUntil:validUntil,

note:note

}

);


if(!result.success){


resultBox.innerHTML =

"❌ "
+
result.message;

return;

}


let html =

"<h2>🎉 優惠券建立成功</h2>";


result.coupons.forEach(


function(coupon){


html +=

'<div class="coupon-item">'


+

"<b>🎫 優惠券：</b> "

+

coupon.code


+

"<br>"


+

"<b>💰 折扣：</b> NT$ "

+

coupon.discount


+

"<br>"


+

"<b>📅 有效期限：</b> "

+

coupon.validUntil


+

"<br>"


+

"<b>📝 備註：</b> "

+

coupon.note


+

"<br><br>"


+

"<b>🔗 客人連結：</b>"


+

'<div class="link-box">'


+

'<a href="'


+

coupon.customerUrl


+

'" target="_blank">'


+

coupon.customerUrl


+

"</a>"


+

"</div>"


+

"</div>";


}


);


resultBox.innerHTML =

html;


}


catch(error){


resultBox.innerHTML =

"❌ 建立失敗："

+

error.message;


}


}



/* =====================
手動核銷
===================== */


function redeemManual(){


const code =

document
.getElementById("manualCode")
.value
.trim();


if(!code){


showRedeemResult(

false,

"請輸入優惠券序號"

);

return;


}


redeemCoupon(code);


}



/* =====================
執行核銷
===================== */


async function redeemCoupon(code){


showRedeemResult(

null,

"⏳ 核銷中..."

);


try{


const result =

await callAPI(

"redeem",

{

code:code

}

);


if(result.success){


showRedeemResult(

true,

result.message

+

"<br><br>"

+

"🎫 優惠券："

+

result.code

+

"<br>"

+

"💰 折扣：NT$ "

+

result.discount

+

"<br>"

+

"🕒 核銷時間："

+

result.usedDate

);


document
.getElementById("manualCode")
.value =
"";


}


else{


showRedeemResult(

false,

result.message

);


}


}


catch(error){


showRedeemResult(

false,

"核銷失敗："
+
error.message

);


}


}



/* =====================
顯示結果
===================== */


function showRedeemResult(
success,
message
){


const box =

document
.getElementById("redeemResult");


box.style.display =
"block";


box.className =
"result-box";


if(success === true){


box.className +=
" success";


}


if(success === false){


box.className +=
" error";


}


if(success === null){


box.className +=
" loading";


}


box.innerHTML =
message;


}



/* =====================
開啟掃描
===================== */


function startScanner(){


if(scannerRunning){

return;

}


html5QrCode =

new Html5Qrcode(
"reader"
);


scannerRunning =

true;


Html5Qrcode
.getCameras()


.then(


cameras => {


if(!cameras.length){


throw new Error(
"找不到相機"
);


}


let cameraId =

cameras[0].id;


/* 優先後鏡頭 */


cameras.forEach(


camera => {


const label =

camera.label
.toLowerCase();


if(

label.includes("back")

||

label.includes("rear")

||

label.includes("environment")

){


cameraId =

camera.id;


}


}


);


return html5QrCode.start(


cameraId,


{

fps:10,


qrbox:{

width:220,

height:220

}

},


qrMessage => {


stopScanner();


redeemCoupon(
qrMessage
);


}


);


}


)


.catch(


error => {


scannerRunning =
false;


showRedeemResult(

false,

"無法開啟相機："
+
error.message

);


}


);


}



/* =====================
停止掃描
===================== */


function stopScanner(){


if(

html5QrCode

&&

scannerRunning

){


html5QrCode
.stop()


.then(


()=>{


scannerRunning =
false;


html5QrCode.clear();


}


)


.catch(


()=>{


scannerRunning =
false;


}


);


}


}


</script>


</body>

</html>
