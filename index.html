<style>


/* =========================
   基本設定
========================= */

* {
  box-sizing: border-box;
}


html {
  min-height: 100%;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:

    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  color: #655963;

  overflow-x: hidden;


  background:

    radial-gradient(
      circle at 8% 5%,
      rgba(255,220,235,.65),

    radial-gradient(
      circle at 90% 5%,
      rgba(255,170,205,.52),

      circle at 5% 45%,
      rgba(255,205,225,.50),

    radial-gradient(

    ),

      transparent 32%

/* =========================
   背景裝飾
========================= */

.background-decor {

  overflow: hidden;

}


.decor {

  position: absolute;

}


.sakura {

  color: rgba(220,110,150,.16);

}


.s1 {

  left: 6%;
  top: 20%;

  font-size: 55px;

  animation:
    floatOne
    7s
    ease-in-out
    infinite;

}


.s2 {

  right: 8%;
  top: 28%;

  font-size: 48px;

  animation:
    floatTwo
    9s
    ease-in-out
    infinite;

}


.s3 {

  left: 10%;
  bottom: 14%;

  font-size: 46px;

  animation:
    floatThree
    8s
    ease-in-out
    infinite;

}


.s4 {

  right: 12%;
  bottom: 10%;

  font-size: 58px;

  animation:
    floatOne
    10s
    ease-in-out
    infinite;

}


.heart {

  color: rgba(220,110,150,.16);

}


.h1 {

  left: 16%;
  top: 48%;

  font-size: 32px;

}


.h2 {

  right: 16%;
  top: 60%;

  font-size: 36px;

}


.star {

  color: rgba(220,140,170,.22);

}


.st1 {

  left: 22%;
  top: 28%;

  font-size: 25px;

}


.st2 {

  right: 24%;
  top: 12%;

  font-size: 30px;

}


@keyframes floatOne {

  0% {

    transform:
      translateY(0)
      rotate(-8deg);

  }

  50% {

    transform:
      translateY(-18px)
      rotate(8deg);

  }

  100% {

    transform:
      translateY(0)
      rotate(-8deg);

  }

}


@keyframes floatTwo {

  0% {

    transform:
      translateY(0)
      rotate(8deg);

  }

  50% {

    transform:
      translateY(15px)
      rotate(-10deg);

  }

  100% {

    transform:
      translateY(0)
      rotate(8deg);

  }

}


@keyframes floatThree {

  0% {

    transform:
      translateX(0);

  }

  50% {

    transform:
      translateX(15px)
      translateY(-10px);

  }

  100% {

    transform:
      translateX(0);

  }

}


/* =========================
   Header
========================= */

.header {

  position: relative;

  width: 100%;

  padding:
    42px
    20px
    28px;

  text-align: center;

}


.logo {

  font-family:
    "Noto Serif TC",
    serif;

  font-size: 62px;

  font-weight: 900;

  letter-spacing: 9px;

  text-indent: 9px;

  line-height: 1.25;

  color: #a95770;

  text-shadow:

    0 8px 20px

}


.subtitle {

  margin-top: 12px;

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 4px;

  color: #786c74;

}


.travel-text-wrapper {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 14px;

  margin-top: 14px;

}


.travel-line {

  background:

}


.travel-line.right {

    linear-gradient(

    );

}


.travel-text {

  font-family:

}


.travel-heart {

}


/* =========================
   登入盒
========================= */

.login-box {

  width:
    min(
      520px,
      90%
    );

  margin:
    35px
    auto
    60px;

  padding:
    38px
    42px;

  background:

    linear-gradient(

      rgba(255,255,255,.92),

}


.login-icon {

  height: 76px;

  margin:

    auto

}


.login-title {

  margin-bottom: 28px;

}


.login-description {

}


/* =========================

========================= */

label {

  display: block;

  font-size: 16px;

  font-weight: 700;

  color: #74656d;

  margin-bottom: 10px;

  text-align: left;

}


input,
textarea {

  width: 100%;

  border:

    1px solid

  border-radius: 16px;

  padding: 16px;

    "Noto Sans TC",

input:focus,
textarea:focus {

  border:

}


#pin,

textarea {

}

button {

  border: none;

  border-radius: 16px;

  padding: 17px;

}

.login-btn {

}

.blue-btn {

}


.green-btn {

    linear-gradient(
      135deg,

.gray-btn {

}


/* =========================

.message {

}


.error {

}


.success {

}


/* =========================

========================= */

.dashboard {

  display: none;

  width:
    min(
      1300px,

    );

    30px

}


.dashboard-top {

  display: flex;

}


.dashboard-welcome {

}


.logout-btn {

}


.dashboard-grid {

}


/* =========================

.card {

    linear-gradient(

}


.card-title {

  font-size: 29px;

  font-weight: 700;

  margin-bottom: 28px;

  letter-spacing: 2px;

}


.pink-title {

.blue-title {

}


.green-title {

}


.divider {

  height: 1px;

  background:

      90deg,
      transparent,

      #e7d2db,
      transparent

  margin:
    32px
    0;

/* =========================
   建立優惠券結果
========================= */

.coupon-list {

}


.coupon-item {

  background:

      255,

    );

}


.coupon-code {

}


/* =========================

#reader {

  border-radius: 20px;

}

  display: none;

}


.coupon-count {

  background:

/* =========================
   手機
========================= */

@media
(
  max-width: 850px
) {

  .dashboard-grid {

  }


  .login-box {

  }


  .dashboard-top {

}


@media

  }


  .travel-text {

    font-size: 23px;

  }


  .travel-line {

    width: 22px;

  }


  .login-title {

  }


  .card {

    padding: 22px;

  }

}


</style>

</head>


<body>


<!-- =========================
     背景
========================= -->

<div class="background-decor">

  <div class="decor sakura s1">
    ✿
  </div>

  <div class="decor sakura s2">
    ❀
  </div>

  <div class="decor sakura s3">
    ✿
  </div>

  <div class="decor sakura s4">
    ❀
  </div>

  <div class="decor heart h1">
    ♡
  </div>

  <div class="decor heart h2">
    ♡
  </div>

  <div class="decor star st1">
    ✧
  </div>

  <div class="decor star st2">
    ✦
  </div>

</div>


<!-- =========================
     Header
========================= -->

<div class="header">

  <div class="logo">
    囍莉旅遊
  </div>


  <div class="subtitle">
    電子優惠券｜工作人員後台
  </div>


  <div class="travel-text-wrapper">

    <div class="travel-line"></div>


    <div class="travel-text">
      Travel Happy Together
    </div>


    <div class="travel-heart">
      ♡
    </div>


    <div class="travel-line right"></div>

  </div>

</div>


<!-- =========================
     第一次建立 PIN
========================= -->

<div
  class="login-box"
  id="setupBox"
  style="display:none"
>

  <div class="login-icon">
    🔐
  </div>


  <div class="login-title">
    建立工作人員 PIN
  </div>


  <div class="login-description">

    這是第一次使用<br>

    請先設定工作人員登入 PIN

  </div>


  <label>
    設定 PIN
  </label>


  <input
    id="newPin"
    type="password"
    inputmode="numeric"
    placeholder="請設定 PIN"
  >


  <label>
    再輸入一次 PIN
  </label>


  <input
    id="confirmPin"
    type="password"
    inputmode="numeric"
    placeholder="再次確認 PIN"
    onkeydown="
      if(event.key === 'Enter')
      {
        setupPin();
      }
    "
  >


  <button
    class="login-btn"
    onclick="setupPin()"
  >
    🌸 建立工作人員 PIN
  </button>


  <div
    id="setupMessage"
    class="message"
  >
  </div>

</div>


<!-- =========================
     PIN 登入
========================= -->

<div
  class="login-box"
  id="loginBox"
  style="display:none"
>

  <div class="login-icon">
    🔐
  </div>


  <div class="login-title">
    工作人員驗證
  </div>


  <label>
    工作人員 PIN
  </label>


  <input
    id="pin"
    type="password"
    inputmode="numeric"
    placeholder="輸入 PIN"
    onkeydown="
      if(event.key === 'Enter')
      {
        login();
      }
    "
  >


  <button
    class="login-btn"
    onclick="login()"
  >
    🌸 進入囍莉旅遊後台
  </button>


  <div
    id="loginMessage"
    class="message"
  >
  </div>

</div>


<!-- =========================
     Dashboard
========================= -->

<div
  class="dashboard"
  id="dashboard"
>


  <div class="dashboard-top">

    <div class="dashboard-welcome">
      🌸 歡迎進入囍莉旅遊工作人員後台
    </div>


    <button
      class="logout-btn"
      onclick="logout()"
    >
      登出
    </button>

  </div>


  <div class="dashboard-grid">


    <!-- =========================
         建立優惠券
    ========================= -->

    <div class="card">


      <div
        class="
          card-title
          pink-title
        "
      >
        🎟️ 建立優惠券
      </div>


      <label>
        建立數量
      </label>


      <input
        id="quantity"
        type="number"
        value="1"
        min="1"
        max="100"
      >


      <label>
        折扣金額
      </label>


      <input
        id="discount"
        type="number"
        value="100"
      >


      <label>
        備註
      </label>


      <textarea
        id="note"
        placeholder="例如：台南出發團體優惠"
      ></textarea>


      <button
        class="pink-btn"
        onclick="createCoupons()"
      >
        🎉 建立優惠券
      </button>


      <div
        class="coupon-list"
        id="createResult"
      >
      </div>


    </div>


    <!-- =========================
         核銷
    ========================= -->

    <div class="card">


      <div
        class="
          card-title
          blue-title
        "
      >
        📷 優惠券核銷
      </div>


      <button
        class="blue-btn"
        onclick="startScanner()"
      >
        📷 開啟相機掃描
      </button>


      <div
        id="reader"
        style="margin-top:20px"
      >
      </div>


      <div class="divider"></div>


      <div
        class="
          card-title
          green-title
        "
      >
        ⌨️ 手動輸入券號
      </div>


      <input
        id="manualCode"
        placeholder="例如 XL-ABCD-1234"
        onkeydown="
          if(event.key === 'Enter')
          {
            redeemManual();
          }
        "
      >


      <button
        class="green-btn"
        onclick="redeemManual()"
      >
        ☑️ 確認核銷
      </button>


      <div
        id="redeemResult"
        class="result-box"
      >
      </div>


      <div class="divider"></div>


      <div class="coupon-count">

        📊 目前瀏覽器內優惠券數量：

        <span id="couponCount">
          0
        </span>

      </div>


    </div>


  </div>


</div>


<script>


/* =========================
   基本變數
========================= */


let html5QrCode =
  null;


let scannerRunning =
  false;


/* =========================
   初始化
========================= */


window.onload =
  function() {

    const savedPin =
      localStorage.getItem(
        "xiliStaffPin"
      );


    if (
      savedPin
    ) {

      showLogin();

    }

    else {

      showSetup();

    }


    updateCouponCount();

  };


/* =========================
   顯示建立 PIN
========================= */


function showSetup() {

  document
    .getElementById(
      "setupBox"
    )
    .style
    .display =
      "block";


  document
    .getElementById(
      "loginBox"
    )
    .style
    .display =
      "none";

}


/* =========================
   顯示登入
========================= */


function showLogin() {

  document
    .getElementById(
      "setupBox"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "loginBox"
    )
    .style
    .display =
      "block";

}


/* =========================
   建立 PIN
========================= */


function setupPin() {

  const newPin =
    document
      .getElementById(
        "newPin"
      )
      .value
      .trim();


  const confirmPin =
    document
      .getElementById(
        "confirmPin"
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        "setupMessage"
      );


  /* PIN 空白 */


  if (
    !newPin
  ) {

    showMessage(
      message,
      false,
      "請輸入 PIN"
    );

    return;

  }


  /* 至少 4 碼 */


  if (
    newPin.length < 4
  ) {

    showMessage(
      message,
      false,
      "PIN 至少需要 4 碼"
    );

    return;

  }


  /* 確認 PIN */


  if (
    newPin !== confirmPin
  ) {

    showMessage(
      message,
      false,
      "兩次輸入的 PIN 不一致"
    );

    return;

  }


  /* 儲存 PIN */


  localStorage.setItem(
    "xiliStaffPin",
    newPin
  );


  showMessage(
    message,
    true,
    "🎉 PIN 建立成功！"
  );


  setTimeout(

    function() {

      showLogin();

      document
        .getElementById(
          "newPin"
        )
        .value =
          "";


      document
        .getElementById(
          "confirmPin"
        )
        .value =
          "";


    },

    1000

  );

}


/* =========================
   登入
========================= */


function login() {

  const inputPin =
    document
      .getElementById(
        "pin"
      )
      .value
      .trim();


  const savedPin =
    localStorage.getItem(
      "xiliStaffPin"
    );


  const message =
    document
      .getElementById(
        "loginMessage"
      );


  if (
    inputPin === savedPin
  ) {

    document
      .getElementById(
        "loginBox"
      )
      .style
      .display =
        "none";


    document
      .getElementById(
        "dashboard"
      )
      .style
      .display =
        "block";


    document
      .getElementById(
        "pin"
      )
      .value =
        "";

  }

  else {

    showMessage(
      message,
      false,
      "❌ PIN 錯誤，請重新輸入"
    );

  }

}


/* =========================
   登出
========================= */


function logout() {

  stopScanner();


  document
    .getElementById(
      "dashboard"
    )
    .style
    .display =
      "none";


  showLogin();

}


/* =========================
   顯示訊息
========================= */


function showMessage(
  element,
  success,
  text
) {

  element.style.display =
    "block";


  if (
    success
  ) {

    element.className =
      "message success";

  }

  else {

    element.className =
      "message error";

  }


  element.innerHTML =
    text;

}


/* =========================
   取得優惠券資料
========================= */


function getCoupons() {

  const data =
    localStorage.getItem(
      "xiliCoupons"
    );


  if (
    !data
  ) {

    return [];

  }


  return JSON.parse(
    data
  );

}


/* =========================
   儲存優惠券
========================= */


function saveCoupons(
  coupons
) {

  localStorage.setItem(

    "xiliCoupons",

    JSON.stringify(
      coupons
    )

  );


  updateCouponCount();

}


/* =========================
   更新數量
========================= */


function updateCouponCount() {

  const coupons =
    getCoupons();


  const count =
    document.getElementById(
      "couponCount"
    );


  if (
    count
  ) {

    count.innerText =
      coupons.length;

  }

}


/* =========================
   產生券號
========================= */


function generateCouponCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let random =
    "";


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    random +=
      chars.charAt(

        Math.floor(
          Math.random()
          *
          chars.length
        )

      );

  }


  const number =
    Date.now()
      .toString()
      .slice(-4);


  return

    "XL-"

    +

    random

    +

    "-"

    +

    number;

}


/* =========================
   建立優惠券
========================= */


function createCoupons() {

  const quantity =
    parseInt(

      document
        .getElementById(
          "quantity"
        )
        .value

    );


  const discount =
    document
      .getElementById(
        "discount"
      )
      .value;


  const note =
    document
      .getElementById(
        "note"
      )
      .value
      .trim();


  const resultBox =
    document
      .getElementById(
        "createResult"
      );


  /* 檢查 */


  if (
    !quantity
    ||
    quantity < 1
  ) {

    resultBox.innerHTML =
      "❌ 請輸入正確建立數量";

    return;

  }


  if (
    quantity > 100
  ) {

    resultBox.innerHTML =
      "❌ 一次最多建立 100 張";

    return;

  }


  if (
    !discount
    ||
    discount < 0
  ) {

    resultBox.innerHTML =
      "❌ 請輸入正確折扣金額";

    return;

  }


  /* 取得資料 */


  const coupons =
    getCoupons();


  const newCoupons =
    [];


  /* 建立 */


  for (
    let i = 0;
    i < quantity;
    i++
  ) {

    const code =
      generateCouponCode();


    const coupon =
      {

        code:
          code,

        discount:
          discount,

        note:
          note,

        status:
          "未使用",

        createdAt:
          new Date()
            .toLocaleString()

      };


    coupons.push(
      coupon
    );


    newCoupons.push(
      coupon
    );

  }


  /* 儲存 */


  saveCoupons(
    coupons
  );


  /* 顯示 */


  let html =
    "<h3 style='color:#c95f80'>🎉 優惠券建立成功</h3>";


  newCoupons.forEach(

    function(coupon) {

      html +=

        "<div class='coupon-item'>"

        +

        "<div class='coupon-code'>"

        +

        "🎫 "

        +

        coupon.code

        +

        "</div>"

        +

        "<div>"

        +

        "💰 折扣：NT$ "

        +

        coupon.discount

        +

        "</div>"

        +

        "<div>"

        +

        "📝 備註："

        +

        (
          coupon.note
          ||
          "無"
        )

        +

        "</div>"

        +

        "<div>"

        +

        "📌 狀態："

        +

        coupon.status

        +

        "</div>"

        +

        "</div>";

    }

  );


  resultBox.innerHTML =
    html;


  /* 清空備註 */


  document
    .getElementById(
      "note"
    )
    .value =
      "";

}


/* =========================
   手動核銷
========================= */


function redeemManual() {

  const code =
    document
      .getElementById(
        "manualCode"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !code
  ) {

    showRedeemResult(
      false,
      "請輸入優惠券序號"
    );

    return;

  }


  redeemCoupon(
    code
  );

}


/* =========================
   執行核銷
========================= */


function redeemCoupon(
  input
) {

  const coupons =
    getCoupons();


  const coupon =
    coupons.find(

      function(item) {

        return

          item.code === input;

      }

    );


  /* 找不到 */


  if (
    !coupon
  ) {

    showRedeemResult(

      false,

      "❌ 找不到這張優惠券"

    );

    return;

  }


  /* 已使用 */


  if (
    coupon.status === "已使用"
  ) {

    showRedeemResult(

      false,

      "⚠️ 這張優惠券已經使用過了<br><br>"

      +

      "🎫 "

      +

      coupon.code

      +

      "<br>"

      +

      "🕒 使用時間："

      +

      coupon.usedAt

    );

    return;

  }


  /* 核銷 */


  coupon.status =
    "已使用";


  coupon.usedAt =
    new Date()
      .toLocaleString();


  saveCoupons(
    coupons
  );


  showRedeemResult(

    true,

    "🎉 優惠券核銷成功！"

    +

    "<br><br>"

    +

    "🎫 優惠券："

    +

    coupon.code

    +

    "<br>"

    +

    "💰 折扣：NT$ "

    +

    coupon.discount

    +

    "<br>"

    +

    "📝 備註："

    +

    (
      coupon.note
      ||
      "無"
    )

    +

    "<br>"

    +

    "🕒 核銷時間："

    +

    coupon.usedAt

  );


  document
    .getElementById(
      "manualCode"
    )
    .value =
      "";

}


/* =========================
   顯示核銷結果
========================= */


function showRedeemResult(
  success,
  message
) {

  const box =
    document
      .getElementById(
        "redeemResult"
      );


  box.style.display =
    "block";


  if (
    success
  ) {

    box.className =
      "result-box success";

  }

  else {

    box.className =
      "result-box error";

  }


  box.innerHTML =
    message;

}


/* =========================
   開啟掃描器
========================= */


function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  Html5Qrcode

    .getCameras()

    .then(

      cameras => {


        if (
          !cameras
          ||
          cameras.length === 0
        ) {

          throw new Error(
            "找不到相機"
          );

        }


        let cameraId =
          cameras[0].id;


        cameras.forEach(

          function(camera) {

            const label =
              camera.label
                .toLowerCase();


            if (

              label.includes("back")

              ||

              label.includes("rear")

              ||

              label.includes("後")

            ) {

              cameraId =
                camera.id;

            }

          }

        );


        return html5QrCode.start(

          cameraId,

          {

            fps:
              10,

            qrbox:
              {

                width:
                  220,

                height:
                  220

              }

          },


          function(
            qrCodeMessage
          ) {

            stopScanner();


            redeemCoupon(
              qrCodeMessage
                .trim()
                .toUpperCase()
            );

          }

        );

      }

    )

    .catch(

      function(error) {

        scannerRunning =
          false;


        showRedeemResult(

          false,

          "❌ 無法開啟相機："

          +

          error.message

        );

      }

    );

}


/* =========================
   停止掃描器
========================= */


function stopScanner() {

  if (

    html5QrCode

    &&

    scannerRunning

  ) {

    html5QrCode

      .stop()

      .then(

        function() {

          scannerRunning =
            false;


          html5QrCode
            .clear();

        }

      )

      .catch(

        function() {

          scannerRunning =
            false;

        }

      );

  }

}
