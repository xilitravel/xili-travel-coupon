<script>


/* ==================================================

⚠️ 最重要

這裡之後要放你的 Google Apps Script Web App 網址

格式：

https://script.google.com/macros/s/XXXXXXXX/exec

================================================== */


const API_URL =

"請把你的_GOOGLE_APPS_SCRIPT_WEB_APP網址_貼在這裡";



let html5QrCode = null;

let scannerRunning = false;



/* ==================================================
API 呼叫
================================================== */


async function callAPI(data) {


try {


const response =

await fetch(

API_URL,

{

method:

"POST",

headers:

{

"Content-Type":

"text/plain;charset=utf-8"

},

body:

JSON.stringify(data)

}

);


const text =

await response.text();


let result;


try {

result = JSON.parse(text);

}

catch(error) {

throw new Error(

"伺服器回傳格式錯誤：" + text

);

}


return result;


}

catch(error) {


throw error;


}


}



/* ==================================================
登入
================================================== */


async function login() {


const pin =

document

.getElementById("pin")

.value

.trim();


const button =

document

.getElementById("loginButton");


if(!pin) {


showLoginMessage(

false,

"請輸入工作人員 PIN"

);


return;


}


button.disabled = true;

button.innerHTML =

"⏳ 驗證中...";


showLoginMessage(

null,

"⏳ 正在驗證..."

);


try {


const result =

await callAPI({

action:

"login",

pin:

pin

});


if(result.success) {


document

.getElementById("loginBox")

.style.display =

"none";


document

.getElementById("dashboard")

.style.display =

"block";


}

else {


showLoginMessage(

false,

result.message ||

"PIN 錯誤"

);


}


}

catch(error) {


showLoginMessage(

false,

"連線失敗：" +

error.message

);


}


button.disabled = false;

button.innerHTML =

"🌸 進入囍莉旅遊後台";


}



/* ==================================================
登入訊息
================================================== */


function showLoginMessage(

success,

message

) {


const box =

document

.getElementById("loginMessage");


box.style.display =

"block";


box.className =

"result-box";


if(success === true) {


box.className +=

" success";


}


else if(success === false) {


box.className +=

" error";


}


else {


box.className +=

" loading";


}


box.innerHTML =

message;


}



/* ==================================================
建立優惠券
================================================== */


async function createCoupons() {


const quantity =

document

.getElementById("quantity")

.value;


const discount =

document

.getElementById("discount")

.value;


const note =

document

.getElementById("note")

.value;


const resultBox =

document

.getElementById("createResult");


const button =

document

.getElementById("createButton");


button.disabled = true;

button.innerHTML =

"⏳ 建立中...";


resultBox.innerHTML =

"⏳ 正在建立優惠券...";


try {


const result =

await callAPI({

action:

"createCoupons",

quantity:

quantity,

discount:

discount,

note:

note

});


if(!result.success) {


throw new Error(

result.message ||

"建立失敗"

);


}


let html =

"<h2>🎉 優惠券建立成功</h2>";


result.coupons.forEach(

function(coupon) {


html +=

'<div class="coupon-item">' +


"<b>🎫 優惠券：</b> " +

coupon.code +


"<br>" +


"<b>💰 折扣：</b> NT$ " +

coupon.discount +


"<br>" +


"<b>📅 有效期限：</b> " +

(

coupon.validUntil ||

"未設定"

) +


"<br>" +


"<b>📝 備註：</b> " +

(

coupon.note ||

"無"

) +


"<br><br>" +


"<b>🔗 客人連結：</b>" +


'<div class="link-box">' +


'<a href="' +

coupon.customerUrl +

'" target="_blank">' +


coupon.customerUrl +


"</a>" +


"</div>" +


"</div>";


}


);


resultBox.innerHTML =

html;


}

catch(error) {

"❌ 建立失敗：" +

}


button.disabled = false;

}



/* ==================================================
手動核銷
================================================== */


function redeemManual() {


const input =

document

.getElementById("manualCode")

.value

.trim();


if(!input) {


showRedeemResult(

false,

"請輸入優惠券序號"

);


return;


}


redeemCoupon(

input

);


}



/* ==================================================
執行核銷
================================================== */


async function redeemCoupon(input) {


showRedeemResult(

null,

"⏳ 核銷中..."

);


try {


const result =

await callAPI({

action:

"redeemCoupon",

code:

input

});


if(result.success) {


showRedeemResult(

true,


result.message +


"<br><br>" +


"🎫 優惠券：" +

(

result.code ||

input

) +


"<br>" +


"💰 折扣：NT$ " +

(

result.discount ||

""

) +


"<br>" +


"🕒 核銷時間：" +

(

result.usedDate ||

""

)


);


document

.getElementById("manualCode")

.value =

"";


}

else {


showRedeemResult(

false,

result.message ||

"核銷失敗"

);


}


}

catch(error) {


showRedeemResult(

false,

"連線失敗：" +

error.message

);


}


}



/* ==================================================
核銷結果
================================================== */


function showRedeemResult(

success,

message

) {


const box =

document

.getElementById("redeemResult");


box.style.display =

"block";


box.className =

"result-box";


if(success === true) {


box.className +=

" success";


}


else if(success === false) {


box.className +=

" error";


}


else {


box.className +=

" loading";


}


box.innerHTML =

message;


}



/* ==================================================
QR Scanner
================================================== */


function startScanner() {


if(scannerRunning) {


return;


}


html5QrCode =

new Html5Qrcode(

"reader"

);


scannerRunning =

true;


Html5Qrcode

.getCameras()

.then(

cameras => {


if(

!cameras ||

cameras.length === 0

) {


throw new Error(

"找不到相機"

);


}


let cameraId =

cameras[0].id;


/* 優先後鏡頭 */


cameras.forEach(

camera => {


const label =

camera.label

.toLowerCase();


if(

label.includes("back") ||

label.includes("rear") ||

label.includes("environment") ||

label.includes("後")

) {


cameraId =

camera.id;


}


}


);


return html5QrCode.start(

cameraId,

{

fps:

10,


qrbox:

{

width:

220,

height:

220

}

},


qrCodeMessage => {


stopScanner();


redeemCoupon(

qrCodeMessage

);


}


);


}

)


.catch(

error => {


scannerRunning =

false;


showRedeemResult(

false,

"❌ 無法開啟相機：" +

error.message

);


}

);


}



/* ==================================================
停止 Scanner
================================================== */


function stopScanner() {


if(

html5QrCode &&

scannerRunning

) {


html5QrCode

.stop()

.then(

() => {


scannerRunning =

false;


return html5QrCode.clear();


}

)

.catch(

() => {


scannerRunning =

false;


}

);


}


}
